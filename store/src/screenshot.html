<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #1b2533 0%, #131921 55%, #2a1d10 100%);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 72px;
    padding: 0 96px;
    box-sizing: border-box;
  }
  .copy { flex: 1; }
  .copy img { width: 72px; height: 72px; margin-bottom: 28px; }
  h1 { font-size: 46px; line-height: 1.15; margin: 0 0 18px; font-weight: 700; }
  p { font-size: 21px; line-height: 1.5; margin: 0; color: #c9d1db; max-width: 520px; }
  .frame {
    flex: none;
    width: 380px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,.55);
    transform: scale(1.3);
    transform-origin: center;
    margin-right: 60px;
    background: #fff;
  }
  iframe { display: block; width: 380px; border: 0; }
</style>
</head>
<body>
  <div class="copy">
    <img src="icon.svg" alt="">
    <h1 id="h"></h1>
    <p id="p"></p>
  </div>
  <div class="frame"><iframe id="f" scrolling="no"></iframe></div>
<script>
  const COPY = {
    picker: ['Choose exactly what to cancel', 'See every Subscribe & Save subscription with its photo. Tick the ones you want gone, or select all.'],
    confirm: ['Review before anything happens', 'One clear confirmation lists every item. Nothing is cancelled until you say so.'],
    progress: ['Sit back while it works', 'Cancels your picks one after another. Watch progress live and stop at any time.']
  };
  const view = new URLSearchParams(location.search).get('view') || 'picker';
  document.getElementById('h').textContent = COPY[view][0];
  document.getElementById('p').textContent = COPY[view][1];
  const f = document.getElementById('f');
  f.style.height = { picker: 532, confirm: 462, progress: 250 }[view] + 'px';
  f.src = 'popup-frame.html?view=' + view;
</script>
</body>
</html>
